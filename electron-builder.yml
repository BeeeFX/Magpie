appId: tv.electrictheatre.magpie
productName: Magpie
copyright: © 2026 BeeeFX

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json
  # La fixture de démonstration n'a rien à faire dans une installation : elle ne sert
  # qu'au développement, et elle pèse plus lourd que l'application elle-même.
  - '!fixtures/**/*'
  - '!src/**/*'
  - '!scripts/**/*'
  - '!icons/**/*'
  # `onnxruntime-node` livre 210 Mo de binaires pour toutes les plateformes et toutes les
  # architectures. La cible étant Windows x64, les 151 Mo restants tripleraient l'installeur
  # sans jamais servir. À revoir le jour où une autre plateforme est réellement produite.
  - '!**/node_modules/onnxruntime-node/bin/napi-v6/linux/**'
  - '!**/node_modules/onnxruntime-node/bin/napi-v6/darwin/**'
  - '!**/node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**'

# `better-sqlite3` et `sharp` embarquent des binaires natifs, et `ffmpeg-static` un
# exécutable : ils doivent rester hors de l'archive asar, dont on ne peut rien exécuter.
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/sharp/**'
  - '**/node_modules/@img/**'
  - '**/node_modules/ffmpeg-static/**'
  # Le moteur ONNX charge un `.node` : comme les autres, il doit rester déballé.
  - '**/node_modules/onnxruntime-node/**'
  # `worker_threads` ne charge pas de façon fiable un script situé dans l'archive asar :
  # le fil de projection et les morceaux qu'il importe doivent être de vrais fichiers.
  - 'out/main/projection.worker.js'
  - 'out/main/chunks/**'

# Les fusibles sont gravés dans le binaire d'Electron à l'empaquetage : ce que la version
# installée ne sait plus faire, aucune variable d'environnement ni option de ligne de commande
# ne peut le lui rendre. Tous étaient à leur valeur par défaut, c'est-à-dire ouverts.
electronFuses:
  # Les cookies des partitions — le `sessionid` d'Instagram, l'`auth_token` de X — étaient
  # écrits en clair sur le disque. Chiffrés désormais avec la clé du système (DPAPI sous
  # Windows). Les cookies en clair d'une version antérieure restent lisibles mais Chromium ne
  # les réécrit pas de lui-même : `encryptPlaintextCookies` (src/main/adapters/session.ts) les
  # repose une fois, chiffrés. Passage à sens unique : un binaire sans ce fusible, devant un
  # magasin chiffré, efface ses cookies — le retirer déconnecterait tout le monde.
  enableCookieEncryption: true
  # Sans eux, n'importe qui pouvait lancer `Magpie.exe` comme un Node nu, avec du code
  # arbitraire signé de notre nom (`ELECTRON_RUN_AS_NODE`, `NODE_OPTIONS`, `--inspect`).
  # Rien dans l'application ne s'en sert : les modèles tournent dans un `utilityProcess`, la
  # projection dans un `worker_thread`, ffmpeg est un exécutable à part.
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  # L'archive est vérifiée contre l'empreinte qu'electron-builder inscrit dans l'exécutable,
  # et c'est la seule que l'application accepte de charger — un dossier `app/` posé à côté ne
  # passe plus devant. Ce qui est déballé (`asarUnpack`) n'est pas couvert : ce sont des
  # binaires natifs et le fil de projection, qui se lisent hors de l'archive par nature.
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # Le renderer est servi par `app://magpie` (voir `src/main/renderer-protocol.ts`) : plus
  # aucune page n'a besoin des privilèges historiques de `file://`.
  grantFileProtocolExtraPrivileges: false

# L'icône est aussi lue au runtime pour la fenêtre et la zone de notification. Les
# ressources de build servent normalement seulement à l'installateur, donc on l'embarque
# explicitement à côté de l'application.
extraResources:
  - from: build/icon.png
    to: icon.png

win:
  # Le nom doit rester strictement identique à celui écrit dans `latest.yml`. Les espaces
  # sont normalisés différemment par GitHub et casseraient le téléchargement automatique.
  artifactName: ${productName}-Setup-${version}.${ext}
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Magpie

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: build/icon.png
  category: public.app-category.productivity
  # Magpie ouvre des fenêtres de connexion vers des sites tiers : sans cette permission,
  # le durcissement du runtime bloquerait le réseau sortant.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: build/icon.png
  category: Graphics

publish:
  provider: github
  owner: BeeeFX
  repo: Magpie
