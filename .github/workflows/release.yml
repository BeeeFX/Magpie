name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Verify tag and package version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version"
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm ci
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds (10 * $attempt) }
          }
          exit 1

      - name: Verify source
        run: |
          npm run typecheck
          npm run check:layout

      - name: Build installer and update manifest
        run: npm run dist:win

      - name: Publish stable GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = Get-Item "release/Magpie-Setup-$version.exe"
          $blockmap = Get-Item "release/Magpie-Setup-$version.exe.blockmap"
          $manifest = Get-Item "release/latest.yml"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash
          $checksum = "release/SHA256SUMS-$version.txt"
          Set-Content -Encoding ascii -Path $checksum -Value "$hash  $($installer.Name)"
          gh release create $env:GITHUB_REF_NAME `
            $installer.FullName `
            $blockmap.FullName `
            $manifest.FullName `
            $checksum `
            --verify-tag `
            --title "Magpie $version" `
            --generate-notes
