name: Verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm ci
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) {
              Write-Host "Dependency download failed; retrying ($attempt/3)..."
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          exit 1

      # Les contrôles sont énumérés une seule fois, dans le script `verify` du package.json,
      # et les deux workflows appellent celui-ci.
      #
      # Ils étaient énumérés ici, à la main. Sur vingt-six scripts `check:`, treize passaient
      # dans ce fichier et **quatre** dans celui de la publication — c'est-à-dire qu'une
      # release pouvait partir avec le schéma dérivé, des traductions manquantes et la carte
      # cassée. Deux listes tenues à la main divergent ; celle-ci était en retard de sept
      # contrôles, tous écrits pour rejouer un défaut déjà livré une fois.
      #
      # `check:ci` interdit désormais d'ajouter un contrôle sans le brancher : tout script
      # `check:*` doit être dans `verify`, ou dans la liste d'exclusions motivée de
      # `scripts/check-ci.ts`.
      - name: Check wiring
        run: npm run check:ci

      - name: Verify
        run: npm run verify
