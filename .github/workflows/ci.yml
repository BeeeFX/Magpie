name: Verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm ci
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) {
              Write-Host "Dependency download failed; retrying ($attempt/3)..."
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          exit 1

      - name: Type checking
        run: npm run typecheck

      - name: Layout checks
        run: npm run check:layout

      - name: Production build
        run: npm run build
