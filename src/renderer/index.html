<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Le renderer n'a le droit de charger que ce que nous produisons : notre bundle et
         les vignettes servies par le protocole magpie://. Rien de distant.

         `ws:` n'existe que pour le rechargement à chaud de Vite. Il partait pourtant dans la
         version installée ; il n'est plus ajouté qu'au service de développement, par
         `scripts/dev-csp.ts`, et la page livrée ne peut ouvrir aucun socket.

         `font-src` doit nommer `data:` : Vite incruste en `data:` le plus petit sous-ensemble
         de la police — le cyrillique étendu, sous le seuil des 4 ko — et, faute de cette
         directive, `default-src 'self'` le refusait à chaque lancement de la version livrée.

         `base-uri` et `form-action` ne sont pas couverts par `default-src` : sans eux, une
         injection pourrait réécrire la base des URLs relatives ou poster ailleurs. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' magpie: data:; media-src 'self' magpie:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' magpie:; base-uri 'none'; form-action 'none'"
    />
    <title>Magpie</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
